# dsh-progress-bar bundle patch.
#
# 挂载本包只插入一行插件。下面的默认值是**完整的**：用户在别处覆盖某一项时，
# 那一整份 config 会被替换，所以要保留的字段必须重述。
#
# 安装会把本包追加进 profile 的 `dsh.profile.bundles`，这一层负责挂行。
#
# 同一个 profile 里不要留两行同 id：两份实例会各自注册
# `/progress-nudge/api` 前缀路由，重复路由会让整棵插件树启动失败。
- insert:
    - id: progress-nudge
      name: 'dsh-progress-bar'
      config:
        # 总开关。侧栏面板上的「暂停/恢复」可以在运行时改它，不动这里。
        enabled: true
        # 累计多少步提醒一次。
        stepThreshold: 10
        # 距上次汇报累计多少秒提醒一次。
        timeThresholdSeconds: 120
        # 两次提醒的最小间隔（秒），兜底的连击保护。
        minGapSeconds: 45
        # 单回合提醒次数上限，超过后静默。
        maxPerTurn: 20
        # 不计步、也不重置计数的工具。
        exclude:
          - todo_write
          - ask_user_question
        # 是否为 subagent 也计数并提醒。
        includeSubagents: false
        # Agent 主动对用户输出文本时，是否把计量归零（刚说过话就别再催）。
        # 只认 text-delta；思考 reasoning-delta、执行 tool-call-delta 都不会触发。
        resetOnSpeech: true
        # 提醒文案语言：zh | en。
        locale: zh
        # 余额监控。余额来自宿主的 deepseekAccount 服务（设置页「账号与余额」
        # 显示的就是它），插件不碰任何 API key，也不关心中转站。
        balance:
          # 是否开启。
          enabled: true
          # 低于这个金额就提醒。
          thresholdCny: 1.5
          # 判定口径：total = 充值 + 赠送（默认；平台扣款先从赠金扣，
          # 只看充值会在"赠金还有一大笔"时误报）；recharge = 只看充值余额。
          scope: total
          # 多久查一次余额（秒），最小 30。
          checkSeconds: 300
          # 仍在阈值以下时，隔多久再提醒一次（秒）；0 = 只提醒一次。
          repeatSeconds: 1800
          # 低于阈值时，是否在进度汇报末尾顺带提一句。
          includeInReport: true
        # 峰谷时段指示。DeepSeek 官方口径：高峰 = 01:00–04:00 与 06:00–10:00 UTC，
        # 周一至周五，剔除中国法定节假日；低谷半价。
        # 换算成北京时间即工作日 09:00–12:00 与 14:00–18:00。
        tariff:
          # 是否在侧栏常驻显示「梁文峰（高峰）/ 梁文谷（低谷）」。
          enabled: true
          # 中国法定节假日（北京时间 YYYY-MM-DD）。官方口径里节假日全天低谷，
          # 但节假日无法离线判断，只能手工列；留空就只按周末 + 时段算。
          holidays: []
        # 自适应退避（侧栏「增强提醒」）。模型跑进「只调工具不说话」的模式时，
        # 提高提醒频率只会变成噪音；正确做法是反过来——拉长间隔 + 加重措辞。
        # 一旦它真的汇报了，立刻复位。
        escalation:
          # 是否启用。侧栏面板的「增强提醒」开关控制这一项（运行时覆盖，不改这里）。
          enabled: true
          # 连续多少次「提醒了但没换来文字」开始升级。
          # 注意：设成 1 表示第一条提醒就按升级档发（普通档不会出现）。
          afterNudges: 2
          # 每升一级，步数阈值乘以多少。
          stepFactor: 2
          # 每升一级，时间阈值乘以多少。
          timeFactor: 2
          # 最高升到第几级（0 = 不升级）。
          maxLevel: 3
        # 版本检测：对比本机版本和 GitHub 最新版本，只在侧栏面板提示，不发消息给模型。
        # ⚠️ 这是插件里唯一会主动出网的功能（余额读的是宿主服务，不算出网）。
        # 不想联网就把 enabled 设成 false，插件就完全离线了。
        updateCheck:
          enabled: true
          # 多久查一次（秒），最小 60。默认 6 小时。
          intervalSeconds: 21600
          # 查哪个地址，需返回 {version:"x.y.z"} 或 {content:"<base64 的 package.json>"}。
          # 默认用 GitHub contents API：实测 github.com 被墙时 api.github.com 常常还能通。
          url: 'https://api.github.com/repos/Kiru-Sama/dsh-progress-bar/contents/package.json?ref=main'
